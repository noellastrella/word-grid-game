        <main id="main" class="game-container">
            <section id="score-container">
                <label> Score: <span id="score"></span></label>
                <label> LVL: <span id="lvl"></span></label>
                <label> Hi Score: <span id="hi-score"></span></label>
            </section>
            
            <section id="word-container">🤔: <span id="word"></span><span id="error"></span></section>
            <section id="upcoming-container">
                <h2>UP NEXT (click to replace)</h2>
                <ul id="upcoming"></ul>
            </section>
            <section id="game-grid">

            </section>

            <section id="text"></section>
            <button id="reset">X</button>
            <button id="clear">CLEAR</button>
            <button id="submit">SUBMIT</button>
            
            <section id="game-over" class="hidden">
                <section id="game-over-banner">
                    <h2>GAME OVER</h2>
                    <ul>
                        <li> Score: <span id="score2"></span></li>
                        <li> LVL: <span id="lvl2"></span></li>
                        <li> Best Score: <span id="hi-score2"></span></li>
                    </ul>

                    <button id="restart">RESTART</button>

                    <aside>
                        <header>Words Used</header>
                        <ol id="words-used">
                        </ol>
                    </aside>
            
                </section>

            </section>
        </main>
